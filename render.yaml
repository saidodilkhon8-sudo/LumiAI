services:
  - type: web
    name: lumiai-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEFAULT_MODEL
        sync: false
      - key: DB_PATH
        value: /tmp/lumi_ai.db
